<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Madruga</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Instrument+Sans:wght@300;400;500;600&family=Space+Mono&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080808;--surf:#0f0f0f;--surf2:#141414;--bord:#1e1e1e;--gold:#c9a84c;--gold-l:#e0c06a;--gold-dim:#8a6f2e;--text:#f0ece4;--muted:#555;--muted2:#888;--ink:#0a0a0a;--p:#7b2fff;--green:#22c55e;--red:#ef4444}
body{background:var(--bg);color:var(--text);font-family:'Instrument Sans',sans-serif;min-height:100vh}
.login{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;padding:20px}
.login-box{width:100%;max-width:360px;text-align:center}
.login-box h1{font-family:'Playfair Display',serif;font-size:42px;font-style:italic;font-weight:700;color:var(--gold);margin-bottom:6px}
.login-box p{color:var(--muted2);font-size:12px;margin-bottom:32px;font-family:'Space Mono',monospace;letter-spacing:1px}
.senha-wrap{position:relative;margin-bottom:12px}
.senha-wrap input{width:100%;background:var(--surf);border:1px solid var(--bord);color:var(--text);padding:14px 48px 14px 16px;font-size:15px;outline:none;font-family:'Instrument Sans',sans-serif;text-align:center;letter-spacing:4px;border-radius:0}
.senha-wrap input:focus{border-color:var(--gold-dim)}
.senha-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted2);cursor:pointer;font-size:16px}
.btn-entrar{width:100%;padding:16px;background:var(--gold);color:var(--ink);border:none;font-family:'Playfair Display',serif;font-size:18px;font-style:italic;font-weight:700;cursor:pointer;transition:all .2s}
.btn-entrar:hover{background:var(--gold-l)}
.login-err{color:var(--red);font-size:12px;margin-top:10px;display:none;font-family:'Space Mono',monospace}

header{background:var(--surf);border-bottom:1px solid var(--bord);padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:60px;position:sticky;top:0;z-index:50}
.hlogo{font-family:'Playfair Display',serif;font-size:16px;font-style:italic;font-weight:700;color:var(--gold)}
.hlogo span{color:var(--muted2);font-size:11px;font-style:normal;font-family:'Space Mono',monospace;letter-spacing:1px;margin-left:8px}
.hacts{display:flex;gap:10px;align-items:center}
.btn-ag{padding:8px 16px;background:var(--gold);color:var(--ink);border:none;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer}
.btn-ap{padding:8px 16px;background:var(--p);color:#fff;border:none;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer}
.btn-out{background:transparent;border:1px solid var(--bord);color:var(--muted2);font-size:10px;padding:8px 14px;font-family:'Space Mono',monospace;cursor:pointer}

/* VIEWS */
.view{display:none}
.view.active{display:block}

/* VENDEDORES */
.vendedores-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding:24px}
.vcard{background:var(--surf);border:1px solid var(--bord);padding:20px;cursor:pointer;transition:all .2s;position:relative}
.vcard:hover{border-color:var(--gold-dim);background:var(--surf2)}
.vcard-nome{font-family:'Playfair Display',serif;font-size:18px;font-style:italic;font-weight:700;color:var(--text);margin-bottom:4px}
.vcard-wpp{font-size:11px;color:var(--muted2);font-family:'Space Mono',monospace;margin-bottom:12px}
.vcard-pix{font-size:10px;color:var(--gold-dim);font-family:'Space Mono',monospace;margin-bottom:12px}
.vcard-stats{display:flex;gap:16px}
.vcard-stat{text-align:center}
.vcard-stat .vs-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--gold);line-height:1}
.vcard-stat .vs-lbl{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:3px;font-family:'Space Mono',monospace}
.vcard-stat.vend .vs-val{color:var(--green)}
.vcard-badge{position:absolute;top:16px;right:16px;display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.badge-g{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2);font-size:9px;font-family:'Space Mono',monospace;padding:2px 8px;letter-spacing:1px}
.badge-p{background:rgba(123,47,255,.1);color:var(--p);border:1px solid rgba(123,47,255,.2);font-size:9px;font-family:'Space Mono',monospace;padding:2px 8px;letter-spacing:1px}
.empty-v{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-v .ei{font-size:48px;margin-bottom:16px}
.empty-v p{font-family:'Space Mono',monospace;font-size:13px;line-height:1.8}

/* PECAS VIEW */
.pecas-header{background:var(--surf);border-bottom:1px solid var(--bord);padding:16px 24px;display:flex;align-items:center;gap:16px}
.btn-back{background:transparent;border:1px solid var(--bord);color:var(--muted2);font-size:12px;padding:8px 16px;font-family:'Space Mono',monospace;cursor:pointer;letter-spacing:1px}
.btn-back:hover{border-color:var(--gold-dim);color:var(--gold)}
.pecas-header-info h2{font-family:'Playfair Display',serif;font-size:20px;font-style:italic;color:var(--text);margin-bottom:2px}
.pecas-header-info p{font-size:11px;color:var(--muted2);font-family:'Space Mono',monospace}
.pecas-header-actions{margin-left:auto;display:flex;gap:10px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--bord);border-bottom:1px solid var(--bord)}
.stat{background:var(--surf);padding:16px;text-align:center}
.stat .val{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;line-height:1}
.stat .lbl{font-size:9px;color:var(--muted);margin-top:4px;text-transform:uppercase;letter-spacing:1px;font-family:'Space Mono',monospace}
.stat.gg .val{color:var(--gold)}
.stat.pp .val{color:var(--p)}
.stat.tt .val{color:var(--text)}
.stat.vv .val{color:var(--green)}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:600px}
th{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);padding:12px 14px;text-align:left;border-bottom:1px solid var(--bord);background:var(--surf)}
td{padding:13px 14px;border-bottom:1px solid var(--bord);font-size:13px;vertical-align:middle}
tr:hover td{background:rgba(255,255,255,.015)}
.pill{display:inline-block;padding:3px 10px;font-size:10px;font-family:'Space Mono',monospace;letter-spacing:1px;font-weight:700}
.pill-g{background:rgba(201,168,76,.1);color:var(--gold);border:1px solid rgba(201,168,76,.2)}
.pill-p{background:rgba(123,47,255,.1);color:var(--p);border:1px solid rgba(123,47,255,.2)}
.ssel{background:transparent;border:1px solid var(--bord);color:var(--text);padding:5px 10px;font-size:11px;font-family:'Instrument Sans',sans-serif;cursor:pointer;outline:none}
.ssel option{background:#111}
.ssel.s0{border-color:#f0a500;color:#f0a500}
.ssel.s1{border-color:var(--gold);color:var(--gold)}
.ssel.s2{border-color:var(--green);color:var(--green)}
.ssel.s3{border-color:var(--muted2);color:var(--muted2)}
.btn-del{background:transparent;border:none;color:#2a2a2a;cursor:pointer;font-size:15px;padding:4px 8px;transition:color .2s}
.btn-del:hover{color:var(--red)}
.btn-edit{background:transparent;border:1px solid var(--bord);color:var(--muted2);font-size:11px;padding:5px 10px;cursor:pointer;font-family:'Instrument Sans',sans-serif}
.btn-edit:hover{border-color:var(--gold-dim);color:var(--gold)}
.foto-thumb{width:44px;height:44px;object-fit:cover;border-radius:2px;border:1px solid var(--bord)}
.no-foto{width:44px;height:44px;background:var(--surf2);border:1px solid var(--bord);border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:18px}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty .ei{font-size:40px;margin-bottom:12px}
.loading-txt{text-align:center;padding:40px;color:var(--muted);font-family:'Space Mono',monospace;font-size:12px}

/* MODAL */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
.mbg.show{display:flex}
.modal{background:var(--surf);border:1px solid var(--bord);width:100%;max-width:480px;margin:auto}
.mhd{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between}
.mhd h2{font-family:'Playfair Display',serif;font-size:22px;font-style:italic;font-weight:700;color:var(--gold)}
.mhd .cls{background:transparent;border:none;color:var(--muted2);font-size:20px;cursor:pointer;padding:4px}
.mbody{padding:20px}
.mf{margin-bottom:16px}
.mf label{display:block;font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold-dim);font-family:'Space Mono',monospace;margin-bottom:7px}
.mf input,.mf textarea,.mf select{width:100%;background:var(--surf2);border:1px solid var(--bord);color:var(--text);padding:12px 14px;font-family:'Instrument Sans',sans-serif;font-size:13px;outline:none;-webkit-appearance:none;border-radius:0}
.mf input:focus,.mf textarea:focus,.mf select:focus{border-color:var(--gold-dim)}
.mf textarea{resize:vertical;min-height:80px}
.mf select option{background:#111}
.mr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.foto-preview-img{width:100%;max-height:200px;object-fit:cover;border:1px solid var(--bord);margin-top:8px;display:none}
.upload-progress{font-size:12px;color:var(--gold);font-family:'Space Mono',monospace;margin-top:8px;display:none}
.mft{padding:0 20px 20px;display:flex;gap:10px}
.mbtn{flex:1;padding:13px;border:none;font-family:'Playfair Display',serif;font-size:16px;font-style:italic;font-weight:700;cursor:pointer;transition:all .2s}
.mbtn-g{background:var(--gold);color:var(--ink)}
.mbtn-g:hover{background:var(--gold-l)}
.mbtn-p{background:var(--p);color:#fff}
.mbtn-x{background:transparent;border:1px solid var(--bord);color:var(--muted2)}
.toast{position:fixed;bottom:24px;right:24px;background:var(--gold);color:var(--ink);padding:12px 20px;font-family:'Space Mono',monospace;font-size:11px;z-index:999;display:none}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--bord)}
@media(max-width:600px){.hacts .btn-ag,.hacts .btn-ap{font-size:9px;padding:7px 10px}.mr2{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.vendedores-grid{grid-template-columns:1fr;padding:16px}}
</style>
</head>
<body>

<div class="login" id="ls">
  <div class="login-box">
    <h1>Madruga</h1>
    <p>ACESSO RESTRITO — ADMIN</p>
    <div class="senha-wrap">
      <input type="password" id="pwd" placeholder="••••••••" onkeydown="if(event.key==='Enter')chk()">
      <button class="senha-toggle" onclick="togglePwd()">👁️</button>
    </div>
    <button class="btn-entrar" onclick="chk()">Entrar</button>
    <div class="login-err" id="err">Senha incorreta.</div>
  </div>
</div>

<div id="app" style="display:none">
  <header>
    <div class="hlogo">Madruga <span>ADMIN</span></div>
    <div class="hacts">
      <button class="btn-ag" onclick="openM('garimpo',false)">+ Garimpo</button>
      <button class="btn-ap" onclick="openM('basements',false)">+ Basements</button>
      <button class="btn-out" onclick="logout()">SAIR</button>
    </div>
  </header>

  <!-- VIEW: VENDEDORES -->
  <div class="view active" id="view-vendedores">
    <div class="vendedores-grid" id="vendedores-grid">
      <div class="loading-txt">Carregando vendedores...</div>
    </div>
  </div>

  <!-- VIEW: PECAS DO VENDEDOR -->
  <div class="view" id="view-pecas">
    <div class="pecas-header">
      <button class="btn-back" onclick="voltarVendedores()">← Voltar</button>
      <div class="pecas-header-info">
        <h2 id="pecas-vendedor-nome">—</h2>
        <p id="pecas-vendedor-info">—</p>
      </div>
      <div class="pecas-header-actions">
        <button class="btn-ag" onclick="openM('garimpo',false)">+ Garimpo</button>
        <button class="btn-ap" onclick="openM('basements',false)">+ Basements</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat gg"><div class="val" id="sg">0</div><div class="lbl">Garimpo</div></div>
      <div class="stat pp"><div class="val" id="sp">0</div><div class="lbl">Basements</div></div>
      <div class="stat vv"><div class="val" id="sv">0</div><div class="lbl">Vendidas</div></div>
      <div class="stat tt"><div class="val" id="st2">0</div><div class="lbl">Total</div></div>
    </div>
    <div class="tw">
      <table>
        <thead><tr><th>Foto</th><th>Loja</th><th>Categoria</th><th>Descricao</th><th>Venda</th><th>Repasse</th><th>Status</th><th>Acoes</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="loading-txt" id="loading" style="display:none">Carregando...</div>
      <div class="empty" id="empty" style="display:none"><div class="ei">📦</div><p style="font-family:Space Mono,monospace;font-size:13px">Nenhuma peca ainda.</p></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="mbg" id="mb">
  <div class="modal">
    <div class="mhd"><h2 id="mt">Nova peca</h2><button class="cls" onclick="closeM()">✕</button></div>
    <div class="mbody">
      <input type="hidden" id="ms">
      <input type="hidden" id="mid">
      <div class="mf">
        <label>WhatsApp do vendedor</label>
        <input id="m-wpp" type="tel" placeholder="11999999999" oninput="buscaVendedor(this.value)">
      </div>
      <div class="vendedor-card" id="vendedor-card" style="background:var(--surf2);border:1px solid var(--gold-dim);padding:12px 16px;margin-bottom:16px;display:none">
        <div id="vc-nome" style="font-family:'Playfair Display',serif;font-size:16px;font-style:italic;color:var(--gold);margin-bottom:4px"></div>
        <div id="vc-pix" style="font-size:11px;font-family:'Space Mono',monospace;color:var(--muted2)"></div>
      </div>
      <div class="mf"><label>Categoria</label><select id="mc"></select></div>
      <div class="mf"><label>Descricao</label><textarea id="md" placeholder="Descreva a peca..."></textarea></div>
      <div class="mr2">
        <div class="mf"><label>Preco de venda</label><input id="mp-venda" type="text" placeholder="R$ 0,00" oninput="fmt2(this)"></div>
        <div class="mf"><label>Repasse ao vendedor</label><input id="mp-repasse" type="text" placeholder="R$ 0,00" oninput="fmt2(this)"></div>
      </div>
      <div class="mf">
        <label>Foto da peca</label>
        <input type="file" id="m-foto" accept="image/*" onchange="previewFoto(this)" style="background:transparent;border:1px dashed var(--bord);color:var(--muted2);padding:10px;width:100%">
        <img id="foto-preview" class="foto-preview-img">
        <div class="upload-progress" id="upload-progress">Enviando foto...</div>
      </div>
    </div>
    <div class="mft">
      <button class="mbtn mbtn-x" onclick="closeM()">Cancelar</button>
      <button class="mbtn mbtn-g" id="mbtn" onclick="saveI()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SURL='https://bldlhcpghqueklouvtxe.supabase.co';
const SKEY='sb_publishable_l9gN8ThM0Nh_rLO-JE3Pvw_ptxknvpl';
const sb=supabase.createClient(SURL,SKEY);
const PASS='3743';
const CLOUD_NAME='dcc8og8se';
const CLOUD_PRESET='madruga_upload';
const CATS={
  garimpo:['Camiseta','Moletom / Hoodie','Calca','Shorts','Jaqueta','Tenis','Bone / Acessorio','Outro'],
  basements:['Video Game (Console)','Video Game (Jogo)','Manga / HQ','Figura / Colecional','Decoracao / Retro','Eletronico','Outro']
};

let editId=null,allPecas=[],allVendedores=[],vendedorAtual=null,buscaTimer=null,fotoAtual=null,vendedorFiltro=null;

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function togglePwd(){const i=document.getElementById('pwd');i.type=i.type==='password'?'text':'password';}

function chk(){
  if(document.getElementById('pwd').value===PASS){
    document.getElementById('ls').style.display='none';
    document.getElementById('app').style.display='block';
    renderVendedores();
  }else{
    document.getElementById('err').style.display='block';
    document.getElementById('pwd').value='';
  }
}

function logout(){
  document.getElementById('ls').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('pwd').value='';
}

function showView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
}

async function renderVendedores(){
  showView('vendedores');
  const grid=document.getElementById('vendedores-grid');
  grid.innerHTML='<div class="loading-txt">Carregando vendedores...</div>';

  const {data:pecas}=await sb.from('pecas').select('*, vendedores(id,nome,whatsapp,chave_pix)').order('criado_em',{ascending:false});
  allPecas=pecas||[];

  const {data:vendedores}=await sb.from('vendedores').select('*').order('nome');
  allVendedores=vendedores||[];

  if(!allVendedores.length){
    grid.innerHTML='<div class="empty-v"><div class="ei">👥</div><p>Nenhum vendedor ainda.<br>Cadastre uma peca para comecar.</p></div>';
    return;
  }

  grid.innerHTML='';
  allVendedores.forEach(v=>{
    const pecasV=allPecas.filter(p=>p.vendedor_id===v.id);
    const total=pecasV.length;
    const vendidas=pecasV.filter(p=>p.status==='vendido').length;
    const disponiveis=pecasV.filter(p=>p.status==='disponivel'||p.status==='negociando').length;
    const temG=pecasV.some(p=>p.loja==='garimpo');
    const temB=pecasV.some(p=>p.loja==='basements');

    const card=document.createElement('div');
    card.className='vcard';
    card.onclick=()=>abrirVendedor(v.id);
    card.innerHTML=
      '<div class="vcard-badge">'+
        (temG?'<span class="badge-g">GARIMPO</span>':'')+
        (temB?'<span class="badge-p">BASEMENTS</span>':'')+
      '</div>'+
      '<div class="vcard-nome">'+(v.nome||'Vendedor')+'</div>'+
      '<div class="vcard-wpp">📱 '+(v.whatsapp||'—')+'</div>'+
      (v.chave_pix?'<div class="vcard-pix">Pix: '+v.chave_pix+'</div>':'')+
      '<div class="vcard-stats">'+
        '<div class="vcard-stat"><div class="vs-val">'+total+'</div><div class="vs-lbl">Total</div></div>'+
        '<div class="vcard-stat"><div class="vs-val">'+disponiveis+'</div><div class="vs-lbl">Disponiveis</div></div>'+
        '<div class="vcard-stat vend"><div class="vs-val">'+vendidas+'</div><div class="vs-lbl">Vendidas</div></div>'+
      '</div>';
    grid.appendChild(card);
  });
}

function abrirVendedor(vendedorId){
  vendedorFiltro=vendedorId;
  const v=allVendedores.find(x=>x.id===vendedorId)||{};
  const pecasV=allPecas.filter(p=>p.vendedor_id===vendedorId);

  document.getElementById('pecas-vendedor-nome').textContent=v.nome||'Vendedor';
  document.getElementById('pecas-vendedor-info').textContent=(v.whatsapp||'')+(v.chave_pix?' · Pix: '+v.chave_pix:'');

  document.getElementById('sg').textContent=pecasV.filter(p=>p.loja==='garimpo').length;
  document.getElementById('sp').textContent=pecasV.filter(p=>p.loja==='basements').length;
  document.getElementById('sv').textContent=pecasV.filter(p=>p.status==='vendido').length;
  document.getElementById('st2').textContent=pecasV.length;

  renderPecas(pecasV);
  showView('pecas');
}

function voltarVendedores(){
  vendedorFiltro=null;
  renderVendedores();
}

function renderPecas(pecas){
  const tb=document.getElementById('tbody');
  tb.innerHTML='';
  if(!pecas.length){document.getElementById('empty').style.display='block';return;}
  document.getElementById('empty').style.display='none';

  pecas.forEach(p=>{
    const isG=p.loja==='garimpo';
    const si=['disponivel','negociando','vendido','devolvido'].indexOf(p.status||'disponivel');
    const tr=document.createElement('tr');
    tr.innerHTML=
      '<td>'+(p.foto_url?'<img src="'+p.foto_url+'" class="foto-thumb" onerror="this.parentNode.innerHTML=\'<div class=no-foto>📷</div>\'">':`<div class="no-foto">📷</div>`)+'</td>'+
      '<td><span class="pill '+(isG?'pill-g':'pill-p')+'">'+(isG?'GARIMPO':'BASEMENTS')+'</span></td>'+
      '<td style="color:var(--muted2);font-size:12px">'+(p.categoria||'—')+'</td>'+
      '<td style="max-width:160px;font-size:12px;color:var(--muted2)">'+(p.descricao||'').substring(0,50)+(p.descricao&&p.descricao.length>50?'...':'')+'</td>'+
      '<td style="font-family:monospace;font-size:12px;color:var('+(isG?'--gold':'--p')+')">'+(p.preco_venda?'R$ '+Number(p.preco_venda).toFixed(2).replace('.',','):'—')+'</td>'+
      '<td style="font-family:monospace;font-size:12px;color:var(--green)">'+(p.preco_repasse?'R$ '+Number(p.preco_repasse).toFixed(2).replace('.',','):'—')+'</td>'+
      '<td><select class="ssel s'+Math.max(0,si)+'" onchange="setSt(\''+p.id+'\',this)">'+
        '<option value="disponivel" '+(p.status==='disponivel'?'selected':'')+'>🟡 Disponivel</option>'+
        '<option value="negociando" '+(p.status==='negociando'?'selected':'')+'>🔄 Negociando</option>'+
        '<option value="vendido" '+(p.status==='vendido'?'selected':'')+'>✅ Vendido</option>'+
        '<option value="devolvido" '+(p.status==='devolvido'?'selected':'')+'>↩️ Devolvido</option>'+
      '</select></td>'+
      '<td style="display:flex;gap:6px;align-items:center">'+
        '<button class="btn-edit" onclick="editI(\''+p.id+'\')">✏️</button>'+
        '<button class="btn-del" onclick="delI(\''+p.id+'\')">🗑️</button>'+
      '</td>';
    tb.appendChild(tr);
  });
}

async function setSt(id,sel){
  sel.className='ssel s'+['disponivel','negociando','vendido','devolvido'].indexOf(sel.value);
  await sb.from('pecas').update({status:sel.value}).eq('id',id);
  toast('Status atualizado!');
  if(vendedorFiltro) abrirVendedor(vendedorFiltro);
  else renderVendedores();
}

async function delI(id){
  if(!confirm('Excluir esta peca?'))return;
  await sb.from('pecas').delete().eq('id',id);
  toast('Excluida!');
  if(vendedorFiltro) await renderVendedores().then(()=>abrirVendedor(vendedorFiltro));
  else renderVendedores();
}

function openM(store,preserveEdit){
  if(!preserveEdit)editId=null;
  vendedorAtual=null;fotoAtual=null;
  document.getElementById('ms').value=store;
  document.getElementById('mt').textContent='Nova peca — '+(store==='garimpo'?'Garimpo':'Basements');
  document.getElementById('mbtn').className='mbtn '+(store==='garimpo'?'mbtn-g':'mbtn-p');
  const sel=document.getElementById('mc');
  sel.innerHTML='<option value="">Seleciona</option>';
  CATS[store].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;sel.appendChild(o);});

  // Se tiver vendedor filtrado, preenche o WhatsApp automaticamente
  if(vendedorFiltro&&!preserveEdit){
    const v=allVendedores.find(x=>x.id===vendedorFiltro);
    if(v){
      document.getElementById('m-wpp').value=v.whatsapp||'';
      vendedorAtual={id:v.id,nome:v.nome,chave_pix:v.chave_pix};
      document.getElementById('vc-nome').textContent=v.nome||'Vendedor';
      document.getElementById('vc-pix').textContent=v.chave_pix?'Pix: '+v.chave_pix:'Sem chave pix';
      document.getElementById('vendedor-card').style.display='block';
    }
  } else {
    document.getElementById('m-wpp').value='';
    document.getElementById('vendedor-card').style.display='none';
  }

  document.getElementById('md').value='';
  document.getElementById('mp-venda').value='';
  document.getElementById('mp-repasse').value='';
  document.getElementById('m-foto').value='';
  document.getElementById('foto-preview').style.display='none';
  document.getElementById('upload-progress').style.display='none';
  document.getElementById('mb').classList.add('show');
}

async function buscaVendedor(val){
  const wpp=val.replace(/\D/g,'');
  const card=document.getElementById('vendedor-card');
  if(wpp.length<8){card.style.display='none';vendedorAtual=null;return;}
  clearTimeout(buscaTimer);
  buscaTimer=setTimeout(async()=>{
    const {data}=await sb.from('vendedores').select('id,nome,chave_pix').eq('whatsapp',wpp).single();
    if(data){
      vendedorAtual=data;
      document.getElementById('vc-nome').textContent=data.nome||'Vendedor sem nome';
      document.getElementById('vc-pix').textContent=data.chave_pix?'Pix: '+data.chave_pix:'Sem chave pix';
      card.style.display='block';
    }else{
      vendedorAtual=null;
      card.style.display='none';
    }
  },600);
}

async function editI(id){
  const p=allPecas.find(x=>x.id===id);if(!p)return;
  editId=id;fotoAtual=p.foto_url||null;
  openM(p.loja,true);
  document.getElementById('mt').textContent='Editar peca';
  document.getElementById('mid').value=id;
  const v=allVendedores.find(x=>x.id===p.vendedor_id)||{};
  document.getElementById('m-wpp').value=v.whatsapp||'';
  if(v.whatsapp) buscaVendedor(v.whatsapp);
  document.getElementById('md').value=p.descricao||'';
  document.getElementById('mp-venda').value=p.preco_venda?'R$ '+Number(p.preco_venda).toFixed(2).replace('.',','):'';
  document.getElementById('mp-repasse').value=p.preco_repasse?'R$ '+Number(p.preco_repasse).toFixed(2).replace('.',','):'';
  if(p.foto_url){const img=document.getElementById('foto-preview');img.src=p.foto_url;img.style.display='block';}
  setTimeout(()=>document.getElementById('mc').value=p.categoria||'',100);
}

function closeM(){document.getElementById('mb').classList.remove('show');}

function previewFoto(input){
  const file=input.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{const img=document.getElementById('foto-preview');img.src=e.target.result;img.style.display='block';};
  r.readAsDataURL(file);
}

async function uploadCloudinary(file){
  const prog=document.getElementById('upload-progress');
  prog.style.display='block';
  const fd=new FormData();
  fd.append('file',file);
  fd.append('upload_preset',CLOUD_PRESET);
  try{
    const res=await fetch('https://api.cloudinary.com/v1_1/'+CLOUD_NAME+'/image/upload',{method:'POST',body:fd});
    const data=await res.json();
    prog.style.display='none';
    return data.secure_url||null;
  }catch(e){
    prog.style.display='none';
    return null;
  }
}

async function saveI(){
  const store=document.getElementById('ms').value;
  const wpp=document.getElementById('m-wpp').value.replace(/\D/g,'');
  if(!wpp){alert('Coloca o WhatsApp do vendedor!');return;}
  document.getElementById('mbtn').textContent='Salvando...';

  let vendedorId=vendedorAtual?.id||null;
  if(!vendedorId){
    const {data:vNew}=await sb.from('vendedores').insert({nome:'Vendedor',whatsapp:wpp}).select().single();
    if(vNew)vendedorId=vNew.id;
  }
  if(!vendedorId){toast('Erro ao salvar vendedor');document.getElementById('mbtn').textContent='Salvar';return;}

  let fotoUrl=fotoAtual;
  const fotoFile=document.getElementById('m-foto').files[0];
  if(fotoFile){
    fotoUrl=await uploadCloudinary(fotoFile);
    if(!fotoUrl){toast('Erro no upload da foto');document.getElementById('mbtn').textContent='Salvar';return;}
  }

  const toNum=v=>v?parseFloat(v.replace('R$ ','').replace(/\./g,'').replace(',','.')):null;
  const dados={
    vendedor_id:vendedorId,loja:store,
    categoria:document.getElementById('mc').value,
    descricao:document.getElementById('md').value,
    preco_venda:toNum(document.getElementById('mp-venda').value),
    preco_repasse:toNum(document.getElementById('mp-repasse').value),
    status:'disponivel',
    foto_url:fotoUrl
  };

  let error;
  if(editId){({error}=await sb.from('pecas').update(dados).eq('id',editId));}
  else{({error}=await sb.from('pecas').insert(dados));}

  document.getElementById('mbtn').textContent='Salvar';
  if(error){toast('Erro: '+error.message);return;}
  toast(editId?'Peca atualizada!':'Peca cadastrada!');
  closeM();

  if(vendedorFiltro){
    const {data:pecas}=await sb.from('pecas').select('*, vendedores(id,nome,whatsapp,chave_pix)').order('criado_em',{ascending:false});
    allPecas=pecas||[];
    abrirVendedor(vendedorFiltro);
  } else {
    renderVendedores();
  }
}

function fmt2(i){let v=i.value.replace(/\D/g,'');if(!v){i.value='';return;}v=(parseInt(v)/100).toFixed(2);i.value='R$ '+v.replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
document.getElementById('mb').addEventListener('click',function(e){if(e.target===this)closeM();});
</script>
</body>
</html>
